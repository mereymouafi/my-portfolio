<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meryem Ouafi - Portfolio{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
   
    
    <!-- Particle Background -->
    <div class="particles" id="particles"></div>
    
    <!-- Top Navigation -->
    <div class="side-nav">
        <div class="nav-brand">Meryem Ouafi</div>
        <div class="nav-links">
            <div class="side-nav-item active" onclick="scrollToSection('hero')">Home</div>
            <div class="side-nav-item" onclick="scrollToSection('about')">About</div>
            <div class="side-nav-item" onclick="scrollToSection('skills')">Skills</div>
            <div class="side-nav-item" onclick="scrollToSection('projects')">Work</div>
            <div class="side-nav-item" onclick="scrollToSection('experience')">Journey</div>
            <div class="side-nav-item" onclick="scrollToSection('contact')">Contact</div>
        </div>
    </div>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">Meryem Ouafi</div>
            <div>&copy; 2026 All rights reserved.</div>
            <div class="social-links">
                <a href="#" class="social-link"><i class="fab fa-github"></i></a>
                <a href="#" class="social-link"><i class="fab fa-linkedin"></i></a>
                <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-link"><i class="fab fa-dribbble"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
